name: Google Places API facility scraper (main.py)

on:
  workflow_dispatch:  # 手動実行を許可
    inputs:
      config_file:
        description: '設定ファイル (Configuration JSON file)'
        required: true
        type: string
        default: 'settings/settings.json'
      address_csv:
        description: 'Input address CSV (leave empty to use config)'
        required: false
        type: string
      search_query:
        description: 'Search query (leave empty to use config)'
        required: false
        type: string
      included_type:
        description: 'Google Places includedType (leave empty for config/default)'
        required: false
        type: string
      exclude_gids_file:
        description: 'Excluded GID CSV (leave empty to use config)'
        required: false
        type: string
      facility_file:
        description: 'Facility output CSV (leave empty to use config)'
        required: false
        type: string
      review_file:
        description: 'Review output CSV (leave empty to use config)'
        required: false
        type: string
      update_facility_file:
        description: 'Incremental facility output CSV (leave empty to use config)'
        required: false
        type: string
      update_review_file:
        description: 'Incremental review output CSV (leave empty to use config)'
        required: false
        type: string
  workflow_call:       # 再利用可能にする
    inputs:
      config_file:
        required: false
        type: string
        default: 'settings/settings.json'
      address_csv:
        required: false
        type: string
      search_query:
        required: false
        type: string
      included_type:
        required: false
        type: string
      exclude_gids_file:
        required: false
        type: string
      facility_file:
        required: false
        type: string
      review_file:
        required: false
        type: string
      update_facility_file:
        required: false
        type: string
      update_review_file:
        required: false
        type: string
    outputs:
      completion_state:
        description: 'success, partial, or failed'
        value: ${{ jobs.run-places-api-scraper.outputs.completion_state }}

jobs:
  run-places-api-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    outputs:
      completion_state: ${{ steps.places-status.outputs.completion_state }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout private data
        uses: actions/checkout@v4
        with:
          repository: jmh8128494-cloud/googlemap
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-data

      - name: Copy private data to workspace
        run: |
          echo "📂 プライベートデータをワークスペースにコピー中..."
          cp -r private-data/settings ./settings
          cp -r private-data/results ./results
          echo "✅ settings/ と results/ をコピーしました"
          ls -la settings/ results/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate configuration file
        run: |
          CONFIG_FILE="${{ github.event.inputs.config_file || inputs.config_file || 'settings/settings.json' }}"

          echo "🔍 Checking configuration file: $CONFIG_FILE"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Error: Configuration file not found: $CONFIG_FILE"
            echo ""
            echo "Available configuration files in settings/:"
            ls -1 settings/*.json 2>/dev/null || echo "No JSON files found"
            exit 1
          fi

          echo "✅ Configuration file exists"
          echo "📄 File contents (先頭のみ):"
          head -c 500 "$CONFIG_FILE"

          ADDRESS_CSV="${{ inputs.address_csv }}"
          if [ -n "$ADDRESS_CSV" ] && [ ! -f "$ADDRESS_CSV" ]; then
            echo "❌ Error: Input address CSV not found: $ADDRESS_CSV"
            exit 1
          fi
          EXCLUDE_GIDS_FILE="${{ inputs.exclude_gids_file }}"
          if [ -n "$EXCLUDE_GIDS_FILE" ] && [ ! -f "$EXCLUDE_GIDS_FILE" ]; then
            echo "❌ Error: Excluded GID CSV not found: $EXCLUDE_GIDS_FILE"
            exit 1
          fi

          VALIDATE_ARGS=(--config-file "$CONFIG_FILE")
          if [ -n "$ADDRESS_CSV" ]; then
            VALIDATE_ARGS+=(--address-csv "$ADDRESS_CSV")
          fi
          python address_csv_validator.py "${VALIDATE_ARGS[@]}"

      - name: Run Google Places API facility scraper
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          CONFIG_FILE: ${{ github.event.inputs.config_file || inputs.config_file || 'settings/settings.json' }}
          SEARCH_QUERY: ${{ inputs.search_query }}
          INCLUDED_TYPE: ${{ inputs.included_type }}
          ADDRESS_CSV_FILE: ${{ inputs.address_csv }}
          FACILITY_FILE: ${{ inputs.facility_file }}
          REVIEW_FILE: ${{ inputs.review_file }}
          UPDATE_FACILITY_FILE: ${{ inputs.update_facility_file }}
          UPDATE_REVIEW_FILE: ${{ inputs.update_review_file }}
          EXCLUDE_GIDS_FILE: ${{ inputs.exclude_gids_file }}
        timeout-minutes: 270
        run: |
          echo "=== Starting Google Places API facility scraper ==="
          echo "📁 Config file: $CONFIG_FILE"
          echo "🔎 Search query: ${SEARCH_QUERY:-default from config}"
          echo "🏷️ Included type: ${INCLUDED_TYPE:-default from config}"
          echo "📥 Address CSV: ${ADDRESS_CSV_FILE:-default from config}"
          echo "📍 Facility CSV: ${FACILITY_FILE:-default from config}"
          echo "⭐ Review CSV: ${REVIEW_FILE:-default from config}"
          echo "📜 Using script: main.py"
          echo ""
          python main.py

      - name: Upload results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: places-api-results-${{ github.run_number }}
          path: results/
          retention-days: 7

      - name: Update file list
        if: always()
        run: |
          echo "🔄 Updating files.json and workflow options..."
          UPDATE_WORKFLOW_CHOICES=true python update_file_list.py

          echo ""
          echo "📄 files.json content:"
          cat docs/webapp/files.json | head -30

      - name: Save results to private repository
        if: always()
        run: |
          set +e  # エラーで停止しない（常にartifactsは取得できるように）

          echo "💾 結果をプライベートリポジトリに保存中..."
          cp -r results/. private-data/results/ 2>/dev/null || true
          cp -r settings/. private-data/settings/ 2>/dev/null || true

          cd private-data
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add results/ settings/
          if git diff --staged --quiet; then
            echo "ℹ️ プライベートリポジトリに変更なし"
          else
            git commit -m "Update Places API results - $(date +'%Y-%m-%d %H:%M:%S')"
            git pull --rebase origin main || true
            git push
            echo "✅ プライベートリポジトリに保存しました"
          fi

      - name: Finalize Places run status
        id: places-status
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path('results/places_run_status.json')
          state = 'failed'
          details = {}
          if path.exists():
              try:
                  details = json.loads(path.read_text(encoding='utf-8'))
                  state = details.get('status') or 'failed'
              except (OSError, json.JSONDecodeError):
                  state = 'failed'

          if state not in {'success', 'partial', 'failed'}:
              state = 'failed'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'completion_state={state}\n')

          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('## Google Places 施設・レビュー取得\n')
              summary.write(f'- 状態: {state}\n')
              summary.write(
                  f"- 完了住所: {details.get('completed_address_rows', 0)}"
                  f"/{details.get('total_address_rows', 0)}\n"
              )
              if details.get('error_type'):
                  summary.write(f"- エラー種別: {details['error_type']}\n")
              if state == 'partial':
                  summary.write('- 同じ条件で再実行すると未処理住所から再開します。\n')

          PY
      - name: Mark unsuccessful Places run
        if: steps.places-status.outputs.completion_state != 'success'
        run: |
          echo "Places run ended with ${{ steps.places-status.outputs.completion_state }}; results and progress were preserved."
          exit 1
