name: BrightData reviews local interactive parallel batches

on:
  workflow_dispatch:
    inputs:
      csv_file:
        description: 'Input CSV file'
        required: true
        default: 'results/dental_new.csv'
      output_file:
        description: 'Merged review output CSV'
        required: true
        default: 'results/dental_new_reviews.csv'
      merge_to_all_regions:
        description: 'Merge output into all_regions_file'
        required: false
        default: true
        type: boolean
      all_regions_file:
        description: 'All regions review CSV'
        required: false
        default: 'results/dental_new_reviews_all_regions.csv'
      days_back:
        description: 'Days back'
        required: true
        default: '10'
      start_from_batch:
        description: 'Start from batch number'
        required: false
        default: '1'
      rows_per_batch:
        description: 'Rows per batch'
        required: false
        default: '500'
      max_batches:
        description: 'Maximum number of batches to run from start_from_batch (0 = all)'
        required: false
        default: '0'
      batch_wait:
        description: 'Deprecated; kept for compatibility'
        required: false
        default: '120'
      api_batch_size:
        description: 'API batch size'
        required: false
        default: '20'
      max_parallel_jobs:
        description: 'Maximum parallel Docker batches'
        required: false
        default: '1'
      max_wait_minutes:
        description: 'Snapshot wait minutes'
        required: false
        default: '90'
      dataset_id:
        description: 'BrightData Dataset ID'
        required: false
        default: 'gd_luzfs1dn2oa0teb81'
      skip_column:
        description: 'Skip rows when this column is empty'
        required: false
        default: 'web'
      generate_report:
        description: 'Generate report'
        required: true
        default: true
        type: boolean
      report_days:
        description: 'Report days'
        required: false
        default: '10'
  workflow_call:
    inputs:
      csv_file:
        required: true
        type: string
        default: 'results/dental_new.csv'
      output_file:
        required: true
        type: string
        default: 'results/dental_new_reviews.csv'
      merge_to_all_regions:
        required: false
        type: boolean
        default: true
      all_regions_file:
        required: false
        type: string
        default: 'results/dental_new_reviews_all_regions.csv'
      days_back:
        required: true
        type: string
        default: '10'
      start_from_batch:
        required: false
        type: string
        default: '1'
      rows_per_batch:
        required: false
        type: string
        default: '500'
      max_batches:
        required: false
        type: string
        default: '0'
      batch_wait:
        required: false
        type: string
        default: '120'
      api_batch_size:
        required: false
        type: string
        default: '20'
      max_parallel_jobs:
        required: false
        type: string
        default: '1'
      max_wait_minutes:
        required: false
        type: string
        default: '90'
      dataset_id:
        required: false
        type: string
        default: 'gd_luzfs1dn2oa0teb81'
      skip_column:
        required: false
        type: string
        default: 'web'
      generate_report:
        required: false
        type: boolean
        default: true
      report_days:
        required: false
        type: string
        default: '10'
    outputs:
      completion_state:
        description: 'success, partial, or failed'
        value: ${{ jobs.merge-results.outputs.completion_state }}
      failed_batches:
        description: 'JSON list of failed batch ranges'
        value: ${{ jobs.merge-results.outputs.failed_batches }}
      merged_rows:
        description: 'Number of merged review rows'
        value: ${{ jobs.merge-results.outputs.merged_rows }}
      incremental_rows:
        description: 'Number of newly merged review rows'
        value: ${{ jobs.merge-results.outputs.incremental_rows }}
    secrets:
      BRIGHTDATA_API_TOKEN:
        required: true
      BRIGHTDATA_ZONE_NAME:
        required: false
      PRIVATE_REPO_PAT:
        required: true

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      total_rows: ${{ steps.plan.outputs.total_rows }}
      total_batches: ${{ steps.plan.outputs.total_batches }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jmh8128494-cloud/googlemap
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-data
          sparse-checkout: |
            settings
            results
      - name: Copy private data
        run: |
          cp -r private-data/settings ./settings
          cp -r private-data/results ./results
      - name: Build dynamic matrix
        id: plan
        env:
          CSV_FILE: ${{ inputs.csv_file }}
          ROWS_PER_BATCH: ${{ inputs.rows_per_batch }}
          START_FROM_BATCH: ${{ inputs.start_from_batch }}
          MAX_BATCHES: ${{ inputs.max_batches }}
          MAX_PARALLEL_JOBS: ${{ inputs.max_parallel_jobs }}
          API_BATCH_SIZE: ${{ inputs.api_batch_size }}
        run: |
          python - <<'PY'
          import json, math, os
          from pathlib import Path
          csv_file = Path(os.environ["CSV_FILE"])
          rows_per_batch = int(os.environ["ROWS_PER_BATCH"])
          start_from_batch = int(os.environ["START_FROM_BATCH"])
          max_batches = int(os.environ["MAX_BATCHES"])
          max_parallel_jobs = int(os.environ["MAX_PARALLEL_JOBS"])
          api_batch_size = int(os.environ["API_BATCH_SIZE"])
          if not 1 <= rows_per_batch <= 500 or start_from_batch < 1:
              raise SystemExit("rows_per_batch must be between 1 and 500; start_from_batch must be greater than 0")
          if max_batches < 0:
              raise SystemExit("max_batches must be 0 or greater")
          if max_parallel_jobs != 1:
              raise SystemExit("max_parallel_jobs must be exactly 1")
          if api_batch_size != 20:
              raise SystemExit("api_batch_size must be exactly 20")
          if api_batch_size * max_parallel_jobs > 20:
              raise SystemExit("api_batch_size * max_parallel_jobs must be 20 or less")
          if not csv_file.exists():
              raise SystemExit(f"CSV file not found: {csv_file}")
          total_rows = max(sum(1 for _ in csv_file.open("r", encoding="utf-8-sig", errors="ignore")) - 1, 0)
          total_batches = math.ceil(total_rows / rows_per_batch) if total_rows else 0
          include = []
          for batch in range(start_from_batch, total_batches + 1):
              start_row = (batch - 1) * rows_per_batch + 1
              end_row = min(batch * rows_per_batch, total_rows)
              include.append({"batch_number": batch, "start_row": start_row, "end_row": end_row})
              if max_batches and len(include) >= max_batches:
                  break
          MAX_MATRIX_JOBS = 256  # GitHub Actionsのmatrix上限（フェイルセーフ）
          if len(include) > MAX_MATRIX_JOBS:
              raise SystemExit(
                  f"選択されたバッチ数({len(include)})がGitHub Actionsの上限({MAX_MATRIX_JOBS})を超えています。 "
                  f"rows_per_batch を増やすか、max_batches を{MAX_MATRIX_JOBS}以下に設定してください。"
                  f" (total_rows={total_rows}, total_batches={total_batches})"
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"matrix={json.dumps({'include': include}, separators=(',', ':'))}\n")
              out.write(f"total_rows={total_rows}\n")
              out.write(f"total_batches={total_batches}\n")
          print(f"total_rows={total_rows}, total_batches={total_batches}, selected_batches={len(include)}")
          PY

  run-batches:
    needs: prepare
    if: needs.prepare.outputs.total_batches != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(inputs.max_parallel_jobs) }}
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jmh8128494-cloud/googlemap
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-data
          sparse-checkout: |
            settings
            results
      - name: Copy private data
        run: |
          cp -r private-data/settings ./settings
          cp -r private-data/results ./results
          mkdir -p results/reviews_parallel results/logs
      - name: Run Docker batch
        id: scrape
        continue-on-error: true
        timeout-minutes: 270
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          ZONE_NAME: ${{ secrets.BRIGHTDATA_ZONE_NAME || 'serp_api2' }}
          INPUT_CSV: ${{ inputs.csv_file }}
          OUTPUT_CSV: results/reviews_parallel/output_batch_${{ matrix.batch_number }}.csv
          UPDATE_CSV: results/reviews_parallel/reviews_batch_${{ matrix.batch_number }}.csv
          START_ROW: ${{ matrix.start_row }}
          END_ROW: ${{ matrix.end_row }}
          DAYS_BACK: ${{ inputs.days_back }}
          API_BATCH_SIZE: ${{ inputs.api_batch_size }}
          MAX_WAIT_MINUTES: ${{ inputs.max_wait_minutes }}
          DATASET_ID: ${{ inputs.dataset_id }}
          SKIP_COLUMN: ${{ inputs.skip_column }}
          RUN_STATUS_FILE: results/status/status_batch_${{ matrix.batch_number }}.json
          MATRIX_BATCH_NUMBER: ${{ matrix.batch_number }}
        run: |
          set -o pipefail
          mkdir -p results/status
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            -w /workspace \
            -e BRIGHTDATA_API_TOKEN \
            -e ZONE_NAME \
            -e RUN_STATUS_FILE \
            -e MATRIX_BATCH_NUMBER \
            python:3.12-slim \
            sh -lc '
              set -eu
              python -m pip install --upgrade pip
              pip install -r requirements.txt
              python run_reviews_local_interactive.py \
                --non-interactive \
                --input "'"$INPUT_CSV"'" \
                --output "'"$OUTPUT_CSV"'" \
                --start-row "'"$START_ROW"'" \
                --end-row "'"$END_ROW"'" \
                --days-back "'"$DAYS_BACK"'" \
                --batch-size "'"$API_BATCH_SIZE"'" \
                --max-wait-minutes "'"$MAX_WAIT_MINUTES"'" \
                --dataset-id "'"$DATASET_ID"'" \
                --skip-column "'"$SKIP_COLUMN"'" \
                --update "'"$UPDATE_CSV"'"
            ' 2>&1 | tee "results/logs/batch_${{ matrix.batch_number }}.log"
      - name: Finalize batch status
        if: always()
        env:
          STATUS_FILE: results/status/status_batch_${{ matrix.batch_number }}.json
          STEP_OUTCOME: ${{ steps.scrape.outcome }}
          BATCH_NUMBER: ${{ matrix.batch_number }}
          START_ROW: ${{ matrix.start_row }}
          END_ROW: ${{ matrix.end_row }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['STATUS_FILE'])
          data = {}
          if path.exists():
              try:
                  data = json.loads(path.read_text(encoding='utf-8'))
              except (OSError, json.JSONDecodeError):
                  data = {}
          data.update({
              'batch_number': int(os.environ['BATCH_NUMBER']),
              'start_row': int(os.environ['START_ROW']),
              'end_row': int(os.environ['END_ROW']),
          })
          if os.environ['STEP_OUTCOME'] != 'success':
              data['status'] = 'partial' if int(data.get('completed_api_chunks', 0) or 0) else 'failed'
              data['error_type'] = data.get('error_type') or 'step_failure_or_timeout'
          else:
              data['status'] = data.get('status', 'success')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviews-sequential-batch-${{ matrix.batch_number }}
          path: |
            results/reviews_parallel/*.csv
            results/logs/batch_${{ matrix.batch_number }}.log
            results/status/status_batch_${{ matrix.batch_number }}.json
          if-no-files-found: warn
          retention-days: 7
      - name: Mark failed batch after preserving artifacts
        if: steps.scrape.outcome != 'success'
        run: |
          echo "Batch ${{ matrix.batch_number }} failed or timed out; artifacts and progress were preserved."
          exit 1

  merge-results:
    needs: [prepare, run-batches]
    # フェイルセーフ: 一部バッチが失敗しても、成功した分の取得済みデータは失わずマージする
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.total_batches != '0' &&
      needs.run-batches.result != 'cancelled' &&
      needs.run-batches.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      completion_state: ${{ steps.status.outputs.completion_state }}
      failed_batches: ${{ steps.status.outputs.failed_batches }}
      merged_rows: ${{ steps.merge.outputs.merged_rows }}
      incremental_rows: ${{ steps.merge.outputs.incremental_rows }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jmh8128494-cloud/googlemap
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-data
          sparse-checkout: |
            settings
            results
      - name: Copy private data
        run: |
          cp -r private-data/settings ./settings
          cp -r private-data/results ./results
      - uses: actions/download-artifact@v4
        with:
          pattern: reviews-sequential-batch-*
          path: downloaded-batches
          merge-multiple: true
      - name: Merge batch CSVs
        id: merge
        env:
          OUTPUT_FILE: ${{ inputs.output_file }}
          ALL_REGIONS_FILE: ${{ inputs.all_regions_file }}
          MERGE_TO_ALL_REGIONS: ${{ inputs.merge_to_all_regions }}
          INCREMENT_FILE: results/increments/reviews_increment_${{ github.run_id }}.csv
          DROP_EMPTY_FACILITY_ROWS: 'true'
          MIN_MERGED_ROWS: ${{ inputs.output_file == 'results/dental_reviews.csv' && '100000' || '0' }}
        run: |
          MERGE_OUTPUT_FILE="$GITHUB_OUTPUT" BATCH_PATTERN='downloaded-batches/**/reviews_batch_*.csv' python scripts/merge_review_batches.py
      - name: Summarize batch statuses
        id: status
        if: always()
        run: |
          python - <<'PY'
          import glob, json, os
          from pathlib import Path
          statuses = []
          for filename in sorted(glob.glob('downloaded-batches/**/status_batch_*.json', recursive=True)):
              try:
                  statuses.append(json.loads(Path(filename).read_text(encoding='utf-8')))
              except (OSError, json.JSONDecodeError):
                  continue
          failed = [
              {
                  'batch_number': item.get('batch_number'),
                  'start_row': item.get('start_row'),
                  'end_row': item.get('end_row'),
                  'completed_api_chunks': item.get('completed_api_chunks', 0),
                  'total_api_chunks': item.get('total_api_chunks', 0),
                  'error_type': item.get('error_type', ''),
              }
              for item in statuses if item.get('status') != 'success'
          ]
          successful = len(statuses) - len(failed)
          completed_chunks = sum(int(item.get('completed_api_chunks', 0) or 0) for item in statuses)
          if not statuses or (successful == 0 and completed_chunks == 0):
              state = 'failed'
          elif failed:
              state = 'partial'
          else:
              state = 'success'
          summary = {
              'completion_state': state,
              'successful_batches': successful,
              'completed_api_chunks': completed_chunks,
              'failed_batches': failed,
          }
          output = Path('results/status') / f"reviews_sequential_{os.environ['GITHUB_RUN_ID']}.json"
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(summary, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"completion_state={state}\n")
              handle.write(f"failed_batches={json.dumps(failed, ensure_ascii=False, separators=(',', ':'))}\n")
          PY
      - name: Save to private data repository
        run: |
          mkdir -p "private-data/$(dirname '${{ inputs.output_file }}')"
          cp "${{ inputs.output_file }}" "private-data/${{ inputs.output_file }}"
          if [ "${{ inputs.merge_to_all_regions }}" = "true" ] && [ -f "${{ inputs.all_regions_file }}" ]; then
            mkdir -p "private-data/$(dirname '${{ inputs.all_regions_file }}')"
            cp "${{ inputs.all_regions_file }}" "private-data/${{ inputs.all_regions_file }}"
          fi
          if [ -f "results/increments/reviews_increment_${{ github.run_id }}.csv" ]; then
            mkdir -p "private-data/results/increments"
            cp "results/increments/reviews_increment_${{ github.run_id }}.csv" "private-data/results/increments/"
          fi
          if [ -f "results/status/reviews_sequential_${{ github.run_id }}.json" ]; then
            mkdir -p "private-data/results/status"
            cp "results/status/reviews_sequential_${{ github.run_id }}.json" "private-data/results/status/"
          fi
          cd private-data
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add results/
          git diff --staged --quiet || (git commit -m "Update parallel review batches - $(date +'%Y-%m-%d %H:%M:%S')" && git pull --rebase origin main && git push)
      - name: Summary
        run: |
          echo "## Parallel review batches" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total rows: ${{ needs.prepare.outputs.total_rows }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Total batches: ${{ needs.prepare.outputs.total_batches }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Max parallel jobs: ${{ inputs.max_parallel_jobs }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- run-batches result: ${{ needs.run-batches.result }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.run-batches.result }}" != "success" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "⚠️ 一部バッチが失敗しましたが、成功したバッチのデータはマージ済みです。Actionsの実行一覧で失敗バッチ(赤い✗)の start_row/end_row を確認し、start_from_batch を指定して再実行してください。" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Mark run failed when no batch completed
        if: steps.status.outputs.completion_state == 'failed'
        run: |
          echo "No batch completed successfully; status and available artifacts were preserved."
          exit 1
