name: BrightData_reviews serp api

on:
  workflow_dispatch:
    inputs:
      config_file:
        description: 'Config file to use'
        required: true
        type: choice
        options:
          - settings/settings.json
          - settings/settings_dental.json
          - settings/settings_marige.json
        default: 'settings/settings.json'
      fid_file:
        description: 'FID file path (results/*.csv) - Leave empty to use config file setting'
        required: false
        type: string
        default: ''
      task_name:
        description: 'Task name from settings.json (leave empty for all tasks)'
        required: false
        type: string
      start_line:
        description: 'Start line number (1-based, leave empty for beginning)'
        required: false
        type: string
        default: ''
      process_count:
        description: 'Number of facilities to process (leave empty for all)'
        required: false
        type: string
        default: ''
      workers:
        description: 'Parallel workers count (default: 10)'
        required: false
        type: string
        default: '10'
      review_file:
        description: 'Review output file path (leave empty to use config)'
        required: false
        type: string
        default: ''

  workflow_call:
    inputs:
      config_file:
        description: 'Config file to use'
        required: true
        type: string
        default: 'settings/settings.json'
      fid_file:
        description: 'FID file path (results/*.csv)'
        required: false
        type: string
        default: ''
      task_name:
        description: 'Task name from settings.json'
        required: false
        type: string
      start_line:
        description: 'Start line number'
        required: false
        type: string
        default: ''
      process_count:
        description: 'Number of facilities to process'
        required: false
        type: string
        default: ''
      workers:
        description: 'Parallel workers count'
        required: false
        type: string
        default: '10'
      review_file:
        description: 'Review output file path'
        required: false
        type: string
        default: ''
    outputs:
      completion_state:
        description: 'success, partial, or failed'
        value: ${{ jobs.run-reviews-scraper.outputs.completion_state }}

jobs:
  run-reviews-scraper:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5時間タイムアウト（GitHub Actions制限）
    outputs:
      completion_state: ${{ steps.review-status.outputs.completion_state }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout private data
        uses: actions/checkout@v4
        with:
          repository: jmh8128494-cloud/googlemap
          token: ${{ secrets.PRIVATE_REPO_PAT }}
          path: private-data
          sparse-checkout: |
            settings
            results

      - name: Copy private data to workspace
        run: |
          cp -r private-data/settings ./settings
          cp -r private-data/results ./results
          echo "✅ settings/ と results/ をコピーしました"
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Validate FID file
        if: inputs.fid_file != ''
        run: |
          echo "🔍 Validating FID file: ${{ inputs.fid_file }}"
          if [ ! -f "${{ inputs.fid_file }}" ]; then
            echo "❌ Error: FID file not found: ${{ inputs.fid_file }}"
            echo "📂 Available files in results/:"
            ls -1 results/*.csv 2>/dev/null || echo "  (no CSV files found)"
            exit 1
          fi
          echo "✅ FID file exists: ${{ inputs.fid_file }}"
          
          # Check for FID column
          echo "📋 Checking CSV structure..."
          head -n 1 "${{ inputs.fid_file }}"
          if head -n 1 "${{ inputs.fid_file }}" | grep -qE '施設FID|FID|fid'; then
            echo "✅ FID column detected"
          else
            echo "⚠️  Warning: No FID column found in header, but script will attempt auto-detection"
          fi
      
      - name: Post progress start
        if: github.event.issue.number
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issueNumber = context.issue.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const processCount = '${{ inputs.process_count }}' || '全件';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## 🚀 レビュー取得を開始しました\n\n` +
                    `📊 処理件数: ${processCount}\n` +
                    `⏳ 推定時間: 約${processCount === '全件' ? '60-120' : Math.ceil(parseInt(processCount) / 100 * 10)}分\n\n` +
                    `[実行ログを見る](${runUrl})`
            });
      
      - name: Run reviews scraper
        id: scrape
        continue-on-error: true
        env:
          BRIGHTDATA_API_TOKEN: ${{ secrets.BRIGHTDATA_API_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MAX_WORKERS: ${{ inputs.workers }}
        timeout-minutes: 270
        run: |
          echo "=== Starting parallel review scraper ==="
          echo "🚀 Parallel workers: $MAX_WORKERS"
          
          # FID file の設定
          if [ -n "${{ inputs.fid_file }}" ]; then
            echo "📁 Using custom FID file: ${{ inputs.fid_file }}"
            export FID_FILE_OVERRIDE="${{ inputs.fid_file }}"
          else
            echo "📁 Using default FID file from config"
          fi
          
          # Review file の正規化
          REVIEW_FILE="${{ inputs.review_file }}"
          REVIEW_OPT=""
          if [ -n "$REVIEW_FILE" ]; then
            # 拡張子がなければ追加
            if [[ "$REVIEW_FILE" != *.csv ]]; then
              REVIEW_FILE="${REVIEW_FILE}.csv"
              echo "📝 Added .csv extension: $REVIEW_FILE"
            fi
            REVIEW_OPT="--review-file $REVIEW_FILE"
          fi
          
          python reviews_BrightData_50.py \
            --config "${{ inputs.config_file }}" \
            $REVIEW_OPT \
            ${{ inputs.task_name && format('--task-name "{0}"', inputs.task_name) || '' }} \
            ${{ inputs.start_line && format('--start-line {0}', inputs.start_line) || '' }} \
            ${{ inputs.process_count && format('--process-count {0}', inputs.process_count) || '' }}

      - name: Write SERP review status
        id: review-status
        if: always()
        env:
          SCRAPE_OUTCOME: ${{ steps.scrape.outcome }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          outcome = os.environ.get('SCRAPE_OUTCOME') or 'failure'
          changed = subprocess.run(
              ['git', 'diff', '--no-index', '--quiet', 'private-data/results', 'results'],
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          ).returncode == 1
          state = 'success' if outcome == 'success' else ('partial' if changed else 'failed')
          payload = {
              'status': state,
              'start_line': '${{ inputs.start_line }}',
              'process_count': '${{ inputs.process_count }}',
              'error_type': '' if state == 'success' else 'scraper_step_failure_or_timeout',
          }
          path = Path('results/status/serp_reviews_${{ github.run_id }}.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'completion_state={state}\n')
          PY
          
      - name: Upload results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-results-${{ github.run_number }}
          path: results/
          retention-days: 7
          
      - name: Save results to private repository
        if: always()
        run: |
          echo "💾 結果をプライベートリポジトリに保存中..."
          cp -r results/. private-data/results/ 2>/dev/null || true

          cd private-data
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add results/
          if git diff --staged --quiet; then
            echo "ℹ️ プライベートリポジトリに変更なし"
          else
            git commit -m "Update review data - $(date +'%Y-%m-%d %H:%M:%S')"
            for i in {1..3}; do
              git pull --rebase origin main 2>/dev/null || true
              git push && echo "✅ プライベートリポジトリに保存しました" && break
              echo "⚠️ Push失敗 ($i/3)"
              sleep 5
            done
          fi
          cd ..

          # デモリポジトリには files.json のみコミット
          python update_file_list.py
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/webapp/files.json
          git diff --staged --quiet || (git commit -m "chore: Update file list [skip ci]" && git pull --rebase origin main && git push || true)
      
      - name: Post results to Issue
        if: always() && github.event.issue.number
        uses: actions/github-script@v7
        env:
          COMPLETION_STATE: ${{ steps.review-status.outputs.completion_state }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const issueNumber = context.issue.number;
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const artifactUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts`;
            
            // 結果ファイルのURL（GitHubリポジトリ内）
            const reviewFile = '${{ inputs.review_file }}' || 'results/dental_review.csv';
            const fileUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/${reviewFile}`;
            
            const state = process.env.COMPLETION_STATE || 'failed';
            const heading = state === 'success'
              ? '## 🎉 レビュー取得処理が完了しました'
              : state === 'partial'
                ? '## ⚠️ レビュー取得処理は部分完了です'
                : '## ❌ レビュー取得処理に失敗しました';
            const comment = `${heading}\n\n` +
              `### 📊 結果\n` +
              `- **出力ファイル**: [${reviewFile}](${fileUrl})\n` +
              `- **Artifacts**: [ダウンロード](${artifactUrl})\n` +
              `- **実行ログ**: [詳細を見る](${runUrl})\n\n` +
              `### ⚙️ 実行パラメータ\n` +
              `- Config: \`${{ inputs.config_file }}\`\n` +
              `- FID File: \`${{ inputs.fid_file || '(default)' }}\`\n` +
              `- Review File: \`${{ inputs.review_file || '(default from settings)' }}\`\n` +
              `- Start Line: \`${{ inputs.start_line || 'all' }}\`\n` +
              `- Process Count: \`${{ inputs.process_count || 'all' }}\`\n`;
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: comment
            });

      - name: Mark unsuccessful SERP review run
        if: steps.review-status.outputs.completion_state != 'success'
        run: |
          echo "SERP review run ended with ${{ steps.review-status.outputs.completion_state }}; artifacts were preserved."
          exit 1
